project:
  name: r1-grpo-kaggle
  seed: 42

model:
  name: unsloth/Llama-3.2-1B-Instruct-unsloth-bnb-4bit
  max_seq_length: 512
  load_in_4bit: true
  use_unsloth: true
  fast_inference: false
  gpu_memory_utilization: 0.5

dataset:
  name: openai/gsm8k
  subset: main
  train_split: train
  eval_split: test
  train_size: 32
  quick_eval_size: 16
  final_eval_size: 32

prompt:
  system: "You are a careful mathematical reasoning assistant. Solve the problem step by step and provide the final integer answer in the required XML format."
  template: |
    Solve this grade-school math problem.

    Problem:
    {question}

    Respond exactly with:
    <reasoning>
    your reasoning
    </reasoning>
    <answer>
    final integer answer
    </answer>

training:
  output_dir: outputs/smoke-grpo-llama32-1b-gsm8k
  max_steps: 10
  learning_rate: 0.000005
  per_device_train_batch_size: 2
  generation_batch_size: 2
  gradient_accumulation_steps: 1
  num_generations: 2
  max_prompt_length: 384
  max_completion_length: 128
  temperature: 0.9
  top_p: 0.95
  logging_steps: 1
  save_steps: 10
  save_total_limit: 1
  use_vllm: false
  adam_beta1: 0.9
  adam_beta2: 0.99
  weight_decay: 0.1
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  max_grad_norm: 0.1
  optim: paged_adamw_8bit
  report_to: []

lora:
  r: 8
  alpha: 8
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

rewards:
  correctness: 2.0
  integer_answer: 0.2
  strict_format: 0.5
  soft_format: 0.2
  reasoning_tags: 0.2

tracking:
  enabled: false
  project_name: r1-grpo-kaggle
  run_name: smoke
  log_samples: false
  log_adapter_artifacts: false
  log_model_artifacts: false

export:
  save_adapter: true
  adapter_dir: outputs/smoke-adapter
  publish_adapter: false
  destination: null

evaluation:
  output_dir: results
  batch_size: 1
  max_new_tokens: 128
  temperature: 0.0
  sample_count: 16
